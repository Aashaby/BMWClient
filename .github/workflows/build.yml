name: Build

on:
  push:
    branches: [ nextgen ]
  pull_request:
    branches: [ nextgen ]

jobs:
  # 针对 nextgen 分支的推送：生成开发版并上传为 Artifact
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/nextgen'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setting up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '21'

      - name: Grant write permission to src-theme
        run: sudo chmod -R a+w src-theme

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt

      - name: Extract version and prepare artifact
        id: vars
        run: |
          function gradleprop {
              grep "^${1}=" gradle.properties | cut -d'=' -f2
          }
          echo "LB_VERSION=$(gradleprop 'mod_version')" >> $GITHUB_OUTPUT
          echo "ARCHIVES_BASE_NAME=$(gradleprop 'archives_base_name')" >> $GITHUB_OUTPUT
          echo "Version: $(gradleprop 'mod_version'), BaseName: $(gradleprop 'archives_base_name')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMWClient-${{ steps.vars.outputs.LB_VERSION }}
          path: build/libs/${{ steps.vars.outputs.ARCHIVES_BASE_NAME }}-*.jar
          if-no-files-found: error

  # 针对 PR 或非 nextgen 分支：执行完整构建（含测试和 detekt）并上传 SARIF 报告
  verify-pr:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/nextgen'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setting up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '21'

      - name: Grant write permission to src-theme
        run: sudo chmod -R a+w src-theme

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (full)
        env:
          CI: true
        run: ./gradlew build

      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/detekt.sarif